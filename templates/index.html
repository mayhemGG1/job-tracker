{% extends "base.html" %}

{% block content %}
<p><a href="{{ url_for('add') }}">+ Додати заявку</a></p>
<table border="1" cellpadding="6">
    <tr>
        <th>Компанія</th>
        <th>Посада</th>
        <th>Статус</th>
        <th>Дата</th>
        <th></th>
    </tr>
    {% for application in applications %}
    <tr>
        <td>{{ application.company }}</td>
        <td>{{ application.position }}</td>
        <td>{{ application.status }}</td>
        <td>{{ application.date_applied }}</td>
        <td>
            <form method="post" action="{{ url_for('delete', id=application.id) }}">
                <button type="submit">Видалити</button>
            </form>
        </td>
    </tr>
    {% else %}
    <tr>
        <td colspan="5">Поки що порожньо</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
