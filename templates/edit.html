{% extends "base.html" %}

{% block content %}
<h2>Редагувати заявку</h2>

<form method="post">
    <p>
        <label>Компанія<br>
        <input type="text" name="company" maxlength="100" value="{{ application.company }}" required></label>
    </p>
    <p>
        <label>Посада<br>
        <input type="text" name="position" maxlength="100" value="{{ application.position }}" required></label>
    </p>
    <p>
        <label>Статус<br>
        <select name="status">
            {% for s in ["applied", "interview", "offer", "rejected"] %}
            <option value="{{ s }}" {% if application.status == s %}selected{% endif %}>{{ s }}</option>
            {% endfor %}
        </select></label>
    </p>
    <p>
        <label>Посилання на вакансію<br>
        <input type="url" name="url" maxlength="300" value="{{ application.url or '' }}"></label>
    </p>
    <p>
        <label>Нотатки<br>
        <textarea name="notes" rows="4" cols="40">{{ application.notes or '' }}</textarea></label>
    </p>
    <button type="submit">Зберегти</button>
    <a href="{{ url_for('index') }}">Назад</a>
</form>
{% endblock %}
